plugins {
    id "com.android.application"
}

android {
    namespace "com.visionphoto.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.visionphoto.tablet"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
