plugins {
    id "com.android.application"
}

android {
    namespace "com.visionphoto.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.visionphoto.tablet104"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.4"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation "com.google.android.gms:play-services-location:21.4.0"
}
