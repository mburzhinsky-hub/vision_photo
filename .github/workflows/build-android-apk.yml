name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk VisionPhoto.apk
          sha256sum VisionPhoto.apk > VisionPhoto.apk.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionPhoto-Android
          path: |
            VisionPhoto.apk
            VisionPhoto.apk.sha256.txt
          if-no-files-found: error
